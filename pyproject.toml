[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-document-research"
version = "1.1.0"
description = "Evidence-first financial RAG with a trained reranker and reproducible evaluation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.5,<2", "httpx[socks]>=0.27,<1", "pypdf>=5,<7", "python-multipart>=0.0.18,<1", "joblib>=1.4,<2", "torch>=2.6,<3", "transformers>=4.46,<5", "peft>=0.14,<1", "safetensors>=0.4,<1", "PySocks>=1.7,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["financial_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
